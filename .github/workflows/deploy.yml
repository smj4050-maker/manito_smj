name: Deploy Manito Improved Site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: manito-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install and build
        shell: bash
        run: |
          mapfile -d '' projects < <(find . -type f -path '*/source/build.cjs' -print0)
          if [[ ${#projects[@]} -ne 1 ]]; then
            echo "::error::Expected exactly one source/build.cjs"
            exit 1
          fi
          source_dir="$(dirname "${projects[0]}")"
          npm --prefix "$source_dir" ci
          npm --prefix "$source_dir" run build
          mkdir -p "$RUNNER_TEMP/manito-pages"
          cp "$source_dir/../index.html" "$RUNNER_TEMP/manito-pages/index.html"
          test -s "$RUNNER_TEMP/manito-pages/index.html"
      - uses: actions/upload-pages-artifact@v4
        with:
          name: github-pages
          path: ${{ runner.temp }}/manito-pages

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
        with:
          artifact_name: github-pages
